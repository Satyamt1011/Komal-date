<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>How Well Do You Know Satyam? 🌙</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  color:#f7f0f8;background:#050816;
}
.screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:18px;text-align:center;opacity:0;pointer-events:none;
  transform:scale(.98) translateY(14px);transition:opacity .7s,transform .7s;
  overflow:auto;
}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.sky{position:absolute;inset:0;background:
radial-gradient(circle at 74% 16%,rgba(167,181,255,.2),transparent 25%),
linear-gradient(180deg,#040713,#090e22 55%,#14172d)}
.moon{position:absolute;width:110px;height:110px;border-radius:50%;right:9%;top:8%;
background:#fff7d8;box-shadow:0 0 35px rgba(255,247,216,.5),0 0 90px rgba(170,180,255,.12)}
.moon:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;left:-15px;top:5px;background:#070b1c}
.stars{position:absolute;inset:0}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;box-shadow:0 0 8px white;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.cloud{position:absolute;border-radius:50%;background:rgba(170,180,220,.055);filter:blur(5px);animation:drift 22s linear infinite}
.c1{width:280px;height:65px;left:-12%;top:34%}.c2{width:330px;height:75px;right:-18%;top:67%;animation-delay:8s}
@keyframes drift{to{transform:translateX(38vw)}}
.card{
 position:relative;z-index:5;width:min(94%,650px);padding:27px 19px;
 border-radius:30px;background:rgba(9,14,33,.73);border:1px solid rgba(230,225,255,.13);
 backdrop-filter:blur(12px);box-shadow:0 25px 80px rgba(0,0,0,.45)
}
.icon{font-size:38px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
h1{font-size:clamp(35px,9vw,60px);font-weight:normal;line-height:1.08;color:#fff9e9;margin:12px 0 15px}
h2{font-size:clamp(26px,7vw,43px);font-weight:normal;line-height:1.15;color:#fff9e9;margin:8px 0 22px}
p{font-size:clamp(17px,4.5vw,22px);line-height:1.55;margin:12px 0}
.soft{font-size:15px;color:#abb6d0}
.progress{font:12px Arial,sans-serif;letter-spacing:2px;color:#8792b5;margin-bottom:15px}
.answers{display:grid;gap:10px}
.answer{
 width:100%;border:1px solid rgba(255,255,255,.13);border-radius:18px;
 padding:14px 13px;background:rgba(255,255,255,.065);color:#fff;
 font:17px "Segoe Print","Bradley Hand","Comic Sans MS",cursive;
 cursor:pointer;transition:.25s
}
.answer:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
.answer.pop{animation:pop .55s ease}
@keyframes pop{40%{transform:scale(1.04)}70%{transform:scale(.97)}}
.reaction{
 min-height:38px;margin:14px 0 3px;color:#f2dce9;
 font-size:18px;opacity:0;transform:translateY(8px);transition:.4s
}
.reaction.show{opacity:1;transform:none}
.next{display:none}.next.show{display:inline-block}
.btn{
 border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:12px 21px;
 background:rgba(255,255,255,.08);color:#fff;font:700 15px "Segoe Print",cursive;
 cursor:pointer;margin-top:8px;transition:.25s
}
.btn:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.score{font-size:25px;color:#f7e8ca}
.bigheart{font-size:44px;animation:heart 1.8s infinite}
@keyframes heart{50%{transform:scale(1.13)}}
.celebrate{font-size:40px;animation:float 2.5s infinite}
#shareStatus{font-size:14px;color:#aeb8d2;min-height:22px;margin-top:10px}
@media(max-width:500px){.moon{width:88px;height:88px}.moon:after{width:88px;height:88px}.card{padding:24px 14px}.answer{font-size:16px}}
</style>
</head>
<body>

<!-- INTRO -->
<section class="screen active" id="intro">
<div class="sky"></div><div class="moon"></div><div class="stars" id="starsIntro"></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="card">
<div class="icon">🎯</div>
<h1>Komal…</h1>
<p>Let's see how well you know Satyam. 😌</p>
<p class="soft">There are no serious wrong answers.<br>Probably. 👀</p>
<button class="btn" onclick="startQuiz()">I'm ready 😏</button>
</div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
<div class="sky"></div><div class="moon"></div><div class="stars" id="starsQuiz"></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="card">
<div class="progress" id="progress">QUESTION 1 OF 8</div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<div class="reaction" id="reaction"></div>
<button class="btn next" id="next" onclick="nextQuestion()">Next 🌙</button>
</div>
</section>

<!-- FINAL -->
<section class="screen" id="final">
<div class="sky"></div><div class="moon"></div><div class="stars" id="starsFinal"></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="card">
<div class="celebrate">🎉</div>
<h1>Quiz complete!</h1>
<p class="score" id="score"></p>
<p id="finalMessage"></p>
<p class="soft">Now I'm curious what you actually picked. 👀</p>
<button class="btn" onclick="shareWhatsApp()">💌 Send My Answers</button>
<div id="shareStatus"></div>
<p class="soft" style="margin-top:22px">And one more thing…<br><b>Thursday is getting closer. 🌙❤️</b></p>
</div>
</section>

<script>
const questions=[
{
 q:"If I suddenly say “Let's go somewhere,” what am I most likely to suggest?",
 a:["🚗 A long drive","☕ Coffee","🍕 Food","🌙 Somewhere quiet with a nice view"],
 r:["🚗 A long drive","☕ Coffee","🍕 Food","🌙 Somewhere quiet with a nice view"],
 reacts:[
  "🚗 Hmm… you might know me better than you think. 👀",
  "☕ Safe choice. I approve. 😌",
  "🍕 I mean… you know me. 😂",
  "🌙 Okay, that's a very good guess. 🌙"
 ]
},
{
 q:"What do you think I notice first about you? 👀",
 a:["😊 Your smile","👀 Your eyes","🗣️ The way you talk","🤭 Your expressions"],
 reacts:[
  "😊 That's a very reasonable answer… I'm not confirming anything. 😌",
  "👀 Okay… you know me. 😏",
  "🗣️ Interesting. I'll remember that one.",
  "🤭 Wait… how did you know that? 👀"
 ]
},
{
 q:"What would make a perfect evening?",
 a:["🌆 An evening walk","☕ Coffee & conversation","🍕 Food & lots of talking","🌙 Somewhere under the moon"],
 reacts:[
  "🌆 That actually sounds pretty nice.",
  "☕ Now we're talking. 😌",
  "🍕 Food + conversation? Hard to argue with that.",
  "🌙 Someone has been paying attention. 👀"
 ]
},
{
 q:"If you suddenly say “I'm hungry” 😂, what do I probably do?",
 a:["🍕 Immediately find food","🍫 Find something sweet","☕ Take you for coffee","😌 Ask “What do you want?” 17 times"],
 reacts:[
  "🍕 Correct. Priorities. 😂",
  "🍫 Sweet answer. Literally. 😄",
  "☕ Coffee can solve many problems. 😌",
  "😂 17 times is an exaggeration… probably."
 ]
},
{
 q:"Who is more likely to be late? 😏",
 a:["👑 Komal","😎 Satyam","🤝 Both","⏰ Neither — we're responsible adults 😂"],
 reacts:[
  "👑 Bold answer. Very bold. 😂",
  "😎 You really think so? Interesting… 👀",
  "🤝 Honestly, this may be the safest answer.",
  "😂 Responsible adults? Let's not get carried away."
 ]
},
{
 q:"If we suddenly had a completely free evening, what would I choose?",
 a:["🎬 A movie","🍕 Dinner","🚗 A drive","🌙 Sit somewhere and just talk"],
 reacts:[
  "🎬 Movie night isn't a bad idea. 👀",
  "🍕 You know my priorities.",
  "🚗 A drive sounds tempting.",
  "🌙 Hmm… that answer has potential. 🤍"
 ]
},
{
 q:"What do you think I enjoy most about talking to you? ❤️",
 a:["😂 Your humour","🗣️ Our conversations","👀 Your reactions","🤍 Just… talking to you"],
 reacts:[
  "😂 Definitely makes things interesting.",
  "🗣️ I do enjoy our conversations.",
  "👀 Your reactions are sometimes priceless. 😂",
  "🤍 Okay… that was a dangerously good answer."
 ]
},
{
 q:"Thursday evening is coming. 👀❤️ What do you think I'm most excited about?",
 a:["🍕 The food","☕ The coffee","🌙 The evening","🤍 Spending time with you"],
 reacts:[
  "🍕 You really think food comes first? 😂",
  "☕ Coffee is important… but not THAT important. 😏",
  "🌙 The evening should be nice. Very nice.",
  "🤍 Okay. I'm not going to argue with that one."
 ]
}
];

let current=0;
let selected=[];
let points=0;

function makeStars(id){
 const box=document.getElementById(id); if(!box||box.dataset.done)return;
 box.dataset.done="1";
 for(let i=0;i<34;i++){
  const s=document.createElement("span");s.className="star";
  s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
  s.style.animationDelay=Math.random()*3.5+"s";
  s.style.opacity=.3+Math.random()*.7;box.appendChild(s);
 }
}

function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 makeStars("stars"+id.charAt(0).toUpperCase()+id.slice(1));
}

function startQuiz(){
 current=0;selected=[];points=0;show("quiz");renderQuestion();
}

function renderQuestion(){
 const q=questions[current];
 document.getElementById("progress").textContent=`QUESTION ${current+1} OF ${questions.length}`;
 document.getElementById("question").textContent=q.q;
 const box=document.getElementById("answers");box.innerHTML="";
 const reaction=document.getElementById("reaction");
 reaction.textContent="";reaction.classList.remove("show");
 const next=document.getElementById("next");next.classList.remove("show");

 q.a.forEach((answer,i)=>{
  const b=document.createElement("button");
  b.className="answer";b.textContent=answer;
  b.onclick=()=>choose(i,b);
  box.appendChild(b);
 });
}

function choose(i,button){
 const q=questions[current];
 selected[current]=q.a[i];
 points += i===q.a.length-1 ? 2 : 1;
 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
 button.classList.add("pop");

 const reaction=document.getElementById("reaction");
 reaction.textContent=q.reacts[i];
 reaction.classList.add("show");

 const next=document.getElementById("next");
 next.textContent=current===questions.length-1?"See My Result 🎉":"Next 🌙";
 next.classList.add("show");

 burst();
}

function nextQuestion(){
 if(current<questions.length-1){current++;renderQuestion();}
 else finish();
}

function finish(){
 show("final");
 const percent=Math.round((points/(questions.length*2))*100);
 let msg;
 if(percent>=90) msg="Okay… you know Satyam suspiciously well. 👀❤️";
 else if(percent>=75) msg="Not bad at all… you definitely know me. 😌";
 else if(percent>=55) msg="Hmm… there's clearly some homework left. 😂";
 else msg="Looks like we need a few more conversations. 😏";
 document.getElementById("score").textContent=`Your totally unofficial score: ${percent}%`;
 document.getElementById("finalMessage").textContent=msg;
}

function shareWhatsApp(){
 let text="Komal's How Well Do You Know Satyam? 🎯❤️\\n\\n";
 selected.forEach((x,i)=>text+=`${i+1}. ${questions[i].q}\\n→ ${x}\\n\\n`);
 text+="Quiz complete! 🎉\\n\\nAnd yes… Thursday is getting closer. 🌙❤️";
 const url="https://wa.me/?text="+encodeURIComponent(text);
 window.open(url,"_blank");
 document.getElementById("shareStatus").textContent="WhatsApp opened with your answers ready to send. 💌";
}

function burst(){
 for(let i=0;i<10;i++){
  const e=document.createElement("div");
  e.textContent=["✨","❤️","🌙","⭐","💫"][Math.floor(Math.random()*5)];
  e.style.position="fixed";e.style.left=(35+Math.random()*30)+"%";
  e.style.top=(42+Math.random()*15)+"%";e.style.zIndex=20;
  e.style.fontSize=(16+Math.random()*16)+"px";e.style.pointerEvents="none";
  e.style.transition="all 1s ease";
  document.body.appendChild(e);
  setTimeout(()=>{e.style.transform=`translate(${(Math.random()-.5)*180}px,-${60+Math.random()*120}px) scale(.5)`;e.style.opacity=0},30);
  setTimeout(()=>e.remove(),1100);
 }
}

makeStars("starsIntro");
</script>
</body>
</html>
