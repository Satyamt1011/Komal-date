<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Word For You ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

  body {
    background:
      radial-gradient(circle at 50% 25%, rgba(255,255,255,.08), transparent 20%),
      linear-gradient(180deg, #071326 0%, #0b1930 48%, #030812 100%);
    color: #f8f1df;
    font-family: "Cormorant Garamond", serif;
  }

  .sky {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none;
  }

  .moon {
    position: absolute;
    width: 105px; height: 105px;
    border-radius: 50%;
    right: 11%; top: 8%;
    background: #fff8dc;
    box-shadow: 0 0 35px rgba(255,248,220,.35), 0 0 90px rgba(255,248,220,.12);
    opacity: .95;
  }

  .moon:after {
    content: "";
    position: absolute;
    width: 105px; height: 105px;
    border-radius: 50%;
    left: 27px; top: -10px;
    background: #071326;
  }

  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff;
    opacity: .65;
    animation: twinkle 2.5s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%,100% { opacity: .2; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .card {
    position: relative;
    width: min(92vw, 680px);
    min-height: 72vh;
    margin: 6vh auto 0;
    padding: 42px 30px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: rgba(4, 12, 26, .52);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
    backdrop-filter: blur(5px);
  }

  .eyebrow {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .65;
    margin-bottom: 18px;
  }

  h1 {
    font-family: "Great Vibes", cursive;
    font-size: clamp(46px, 11vw, 76px);
    font-weight: 400;
    margin: 0 0 12px;
    line-height: 1.05;
  }

  .intro {
    max-width: 500px;
    font-size: clamp(20px, 4.5vw, 27px);
    line-height: 1.35;
    opacity: .92;
    margin: 0 auto 28px;
  }

  .note {
    min-height: 245px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .word {
    font-size: clamp(42px, 10vw, 68px);
    font-weight: 600;
    margin: 0 0 18px;
    letter-spacing: 1px;
  }

  .reason {
    max-width: 520px;
    font-size: clamp(20px, 4.6vw, 28px);
    line-height: 1.4;
    margin: 0;
    opacity: .9;
  }

  .final-word {
    font-family: "Great Vibes", cursive;
    font-size: clamp(65px, 17vw, 115px);
    font-weight: 400;
    margin: 5px 0 12px;
    line-height: 1;
    text-shadow: 0 0 28px rgba(255,255,255,.18);
  }

  .final-note {
    max-width: 540px;
    font-size: clamp(20px, 4.7vw, 29px);
    line-height: 1.45;
    margin: 0;
  }

  .hint {
    position: absolute;
    bottom: 23px;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: .55;
    text-transform: uppercase;
  }

  button {
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08);
    color: #f8f1df;
    padding: 12px 25px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
    transition: .25s ease;
    margin-top: 20px;
  }

  button:hover {
    background: rgba(255,255,255,.15);
    transform: translateY(-2px);
  }

  .fade {
    animation: fadeIn .9s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .heart {
    display: inline-block;
    margin-left: 5px;
    animation: heartbeat 1.6s infinite;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
  }

  .hidden { display: none; }

  @media (max-width: 600px) {
    .card {
      min-height: 78vh;
      margin-top: 4vh;
      padding: 34px 22px 45px;
    }
    .moon { width: 75px; height: 75px; right: 7%; top: 5%; }
    .moon:after { width: 75px; height: 75px; left: 20px; top: -8px; }
    .note { min-height: 270px; }
  }
</style>
</head>

<body>
<div class="sky">
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
</div>

<main class="card" id="card">
  <div id="content" class="fade">
    <div class="eyebrow">A little something for you</div>
    <h1>You asked me…</h1>
    <p class="intro">
      “Describe me in one word.”
      <br>
      I tried to find just one… but honestly,
      <br>you made that surprisingly difficult. <span class="heart">♥</span>
    </p>
    <button id="nextBtn">Okay… show me ✨</button>
  </div>
  <div class="hint" id="hint">Tap to continue</div>
</main>

<script>
const slides = [
  {
    word: "Ambitious",
    reason: "Because you don't just dream… you actually want to build the life you've imagined."
  },
  {
    word: "Independent",
    reason: "Because you know how to stand on your own… even when you secretly deserve someone to hold your hand."
  },
  {
    word: "Graceful",
    reason: "There's something about the way you carry yourself… effortlessly you."
  },
  {
    word: "Radiant",
    reason: "Because you have this way of making ordinary moments feel a little brighter."
  },
  {
    word: "Extraordinary",
    reason: "Because there's something about you that isn't quite ordinary… and I don't think it ever will be."
  }
];

let index = -1;
const content = document.getElementById("content");
const button = document.getElementById("nextBtn");
const hint = document.getElementById("hint");

function renderIntro() {
  content.innerHTML = `
    <div class="eyebrow">A little something for you</div>
    <h1>You asked me…</h1>
    <p class="intro">
      “Describe me in one word.”
      <br>
      I tried to find just one… but honestly,
      <br>you made that surprisingly difficult. <span class="heart">♥</span>
    </p>
    <button id="nextBtn">Okay… show me ✨</button>
  `;
  document.getElementById("nextBtn").onclick = next;
}

function renderSlide(slide) {
  content.className = "fade";
  content.innerHTML = `
    <div class="eyebrow">I could describe you as…</div>
    <div class="note">
      <div class="word">${slide.word}</div>
      <p class="reason">“${slide.reason}”</p>
    </div>
    <button id="nextBtn">${index === slides.length - 1 ? "But there’s one more… ✨" : "Next ✨"}</button>
  `;
  document.getElementById("nextBtn").onclick = next;
}

function renderFinal() {
  content.className = "fade";
  content.innerHTML = `
    <div class="eyebrow">If I really had to choose just ONE…</div>
    <div class="note">
      <div class="final-word">Enchanting</div>
      <p class="final-note">
        Because you're a little bit of everything above…
        <br>
        and somehow, all of it together becomes <i>you.</i> ♥
      </p>
    </div>
    <button id="nextBtn" onclick="restart()">Read it again 🌙</button>
  `;
  hint.textContent = "The one word I couldn't replace";
  createExtraStars();
}

function next() {
  index++;
  if (index < slides.length) {
    renderSlide(slides[index]);
    hint.textContent = "Tap to continue";
  } else {
    renderFinal();
  }
}

function restart() {
  index = -1;
  hint.textContent = "Tap to continue";
  renderIntro();
}

function createStars() {
  const container = document.getElementById("stars");
  for (let i = 0; i < 75; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    s.style.animationDuration = (1.8 + Math.random() * 2.8) + "s";
    container.appendChild(s);
  }
}

function createExtraStars() {
  const container = document.getElementById("stars");
  for (let i = 0; i < 25; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 2) + "s";
    s.style.animationDuration = (1.5 + Math.random() * 2) + "s";
    container.appendChild(s);
  }
}

createStars();
document.getElementById("nextBtn").onclick = next;
</script>
</body>
</html>
