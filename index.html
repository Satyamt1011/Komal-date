<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>One Last Little Thing — Komal</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020811;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    color: #f4d69a;
    overflow-x: hidden;
}

/* =========================
   MAIN PAGE
========================= */

.page {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 8px 7px 45px;
}

.heading {
    text-align: center;
    padding: 12px 5px 10px;
}

.heading h1 {
    margin: 0;
    font-size: clamp(25px, 5vw, 42px);
    font-weight: 500;
}

.heading p {
    margin: 5px 0 0;
    color: #d7cdbd;
    font-size: clamp(13px, 2.5vw, 18px);
    font-style: italic;
}

/* =========================
   SLIDES
========================= */

.slides {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.slide {
    position: relative;
    width: 100%;
    aspect-ratio: 1.53 / 1;

    border: 1px solid rgba(240, 204, 139, 0.28);
    border-radius: 8px;
    overflow: hidden;

    background-color: #020811;

    box-shadow:
        0 8px 28px rgba(0,0,0,.45),
        inset 0 0 30px rgba(255,255,255,.02);

    cursor: zoom-in;
}

/*
   IMPORTANT:

   Upload the screenshot/template image to the SAME
   GitHub repository as this HTML file.

   Rename it:

   memories-template.png

   The image is the 3 x 3 layout you provided.
*/

.slide {
    background-image: url("memories-template.png");
    background-repeat: no-repeat;

    /*
       The original image is approximately 3 columns x 3 rows.
       Each slide therefore uses 1/3 of the source image.
    */
    background-size: 300% 300%;
}

/* Row 1 */

.slide:nth-child(1) {
    background-position: 0% 0%;
}

.slide:nth-child(2) {
    background-position: 50% 0%;
}

.slide:nth-child(3) {
    background-position: 100% 0%;
}

/* Row 2 */

.slide:nth-child(4) {
    background-position: 0% 50%;
}

.slide:nth-child(5) {
    background-position: 50% 50%;
}

.slide:nth-child(6) {
    background-position: 100% 50%;
}

/* Row 3 */

.slide:nth-child(7) {
    background-position: 0% 100%;
}

.slide:nth-child(8) {
    background-position: 50% 100%;
}

/* =========================
   FULL SCREEN VIEW
========================= */

.viewer {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.96);

    padding:
        max(10px, env(safe-area-inset-top))
        10px
        max(10px, env(safe-area-inset-bottom))
        10px;
}

.viewer.active {
    display: flex;
}

.viewer-slide {
    width: min(96vw, 1100px);
    aspect-ratio: 1.53 / 1;

    background-image: url("memories-template.png");
    background-repeat: no-repeat;
    background-size: 300% 300%;

    border-radius: 7px;
    box-shadow: 0 20px 80px rgba(0,0,0,.8);
}

/* Positions inside viewer */

.viewer-slide.pos1 { background-position: 0% 0%; }
.viewer-slide.pos2 { background-position: 50% 0%; }
.viewer-slide.pos3 { background-position: 100% 0%; }

.viewer-slide.pos4 { background-position: 0% 50%; }
.viewer-slide.pos5 { background-position: 50% 50%; }
.viewer-slide.pos6 { background-position: 100% 50%; }

.viewer-slide.pos7 { background-position: 0% 100%; }

/* =========================
   CLOSE BUTTON
========================= */

.close {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: 14px;

    width: 43px;
    height: 43px;

    border-radius: 50%;
    border: 1px solid rgba(240,204,139,.55);

    background: #07111d;
    color: #f4d69a;

    font-size: 27px;
    line-height: 40px;

    z-index: 10000;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .page {
        padding: 4px 4px 35px;
    }

    .heading {
        padding: 9px 5px 8px;
    }

    .slides {
        gap: 7px;
    }

    .slide {
        border-radius: 6px;
    }

    /*
       Keep the complete slide visible on mobile.
       No fixed height is used.
    */
    .viewer-slide {
        width: 96vw;
        max-width: 96vw;
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 360px) {

    .heading h1 {
        font-size: 23px;
    }

    .heading p {
        font-size: 12px;
    }

    .slide {
        aspect-ratio: 1.50 / 1;
    }

    .viewer-slide {
        aspect-ratio: 1.50 / 1;
    }
}

/* =========================
   LANDSCAPE MOBILE
========================= */

@media (max-height: 500px) and (orientation: landscape) {

    .viewer {
        padding: 5px;
    }

    .viewer-slide {
        height: 94vh;
        width: auto;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="heading">
        <h1>One Last Little Thing ♡</h1>
        <p>A few memories, kept quietly.</p>
    </header>

    <main class="slides">

        <!-- 1 -->
        <div class="slide"
             onclick="openViewer(1)"
             aria-label="A few memories">
        </div>

        <!-- 2 -->
        <div class="slide"
             onclick="openViewer(2)"
             aria-label="Your birthday gift">
        </div>

        <!-- 3 -->
        <div class="slide"
             onclick="openViewer(3)"
             aria-label="The one and only time I said I love you">
        </div>

        <!-- 4 -->
        <div class="slide"
             onclick="openViewer(4)"
             aria-label="Our one and only hug">
        </div>

        <!-- 5 -->
        <div class="slide"
             onclick="openViewer(5)"
             aria-label="The little things">
        </div>

        <!-- 6 -->
        <div class="slide"
             onclick="openViewer(6)"
             aria-label="I know I wasn't always easy">
        </div>

        <!-- 7 -->
        <div class="slide"
             onclick="openViewer(7)"
             aria-label="Your new chapter">
        </div>

    </main>

</div>


<!-- =========================
     FULL SCREEN IMAGE VIEWER
========================= -->

<div class="viewer"
     id="viewer"
     onclick="closeViewer()">

    <button class="close"
            onclick="event.stopPropagation(); closeViewer();">
        ×
    </button>

    <div id="viewerSlide"
         class="viewer-slide"
         onclick="event.stopPropagation();">
    </div>

</div>


<script>

function openViewer(number) {

    const viewer = document.getElementById("viewer");
    const viewerSlide = document.getElementById("viewerSlide");

    viewerSlide.className = "viewer-slide pos" + number;

    viewer.classList.add("active");

    document.body.style.overflow = "hidden";
}


function closeViewer() {

    const viewer = document.getElementById("viewer");

    viewer.classList.remove("active");

    document.body.style.overflow = "";
}


/* Close with phone/desktop Escape key */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeViewer();
    }

});


/* Prevent accidental browser zoom while double tapping */

let lastTouchEnd = 0;

document.addEventListener("touchend", function(event) {

    const now = Date.now();

    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }

    lastTouchEnd = now;

}, { passive: false });

</script>

</body>
</html>
